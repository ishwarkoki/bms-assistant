services:
  ticket-watch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-watch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      BMS_HOST: 0.0.0.0
      BMS_DATABASE_PATH: /app/data/bms_assistant.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
