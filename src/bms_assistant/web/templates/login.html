<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sign in · {{ app_name }}</title>
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="login-shell">
    <section class="login-card">
      <span class="brand-mark" aria-hidden="true">🎟</span>
      <h1>{{ app_name }}</h1>
      <p class="muted">This dashboard is password protected.</p>

      {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

      <form method="post" action="/login" class="login-form">
        <input type="hidden" name="next" value="{{ next }}">
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required autofocus
                 autocomplete="current-password">
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
